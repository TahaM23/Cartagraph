<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="The analysis run: five stages, fetch, select, parse, label and store. Only label calls a model. Each stage writes its progress to the analyses row, which Realtime pushes to the progress page; the map opens on completion.">
  <style>
    .box{fill:#ffffff;stroke:#c8cdd6;stroke-width:1.4}
    .grp{fill:none;stroke:#c8cdd6;stroke-width:1.2;stroke-dasharray:5 4}
    .mdl{fill:#fdf2df;stroke:#b06f12;stroke-width:1.6}
    .t{fill:#171a20;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#5a6170;font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .l{fill:#5a6170;font:italic 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .g{fill:#5a6170;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .ln{stroke:#171a20;stroke-width:1.3;fill:none}
    .tick{stroke:#c8cdd6;stroke-width:1.3;fill:none}
    .ah{fill:#171a20}
    @media (prefers-color-scheme: dark){
      .box{fill:#171a21;stroke:#363c48}.grp,.tick{stroke:#363c48}.mdl{fill:#2a2114;stroke:#e2a646}
      .t{fill:#e5e7ec}.s,.l,.g{fill:#9aa2b1}.ln{stroke:#e5e7ec}.ah{fill:#e5e7ec}
    }
  </style>
      <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>

      <rect class="box" x="20" y="10" width="160" height="44" rx="4"/>
      <text class="t" x="100" y="29" text-anchor="middle">GitHub</text>
      <text class="s" x="100" y="45" text-anchor="middle">commit sha · tarball</text>
      <rect class="mdl" x="590" y="10" width="160" height="44" rx="4"/>
      <text class="t" x="670" y="29" text-anchor="middle">OpenAI nano</text>
      <text class="s" x="670" y="45" text-anchor="middle">cached per file hash</text>

      <line class="ln" x1="100" y1="54" x2="100" y2="107" marker-end="url(#a)"/>
      <text class="l" x="108" y="86">download</text>
      <line class="ln" x1="670" y1="54" x2="670" y2="107" marker-end="url(#a)"/>
      <text class="l" x="678" y="86">≤ 400 files a run</text>

      <rect class="box" x="20" y="110" width="160" height="62" rx="4"/>
      <text class="t" x="100" y="136" text-anchor="middle">fetch</text>
      <text class="s" x="100" y="156" text-anchor="middle">commit + archive</text>
      <rect class="box" x="210" y="110" width="160" height="62" rx="4"/>
      <text class="t" x="290" y="136" text-anchor="middle">select</text>
      <text class="s" x="290" y="156" text-anchor="middle">walk, ≤ 5,000 files</text>
      <rect class="box" x="400" y="110" width="160" height="62" rx="4"/>
      <text class="t" x="480" y="136" text-anchor="middle">parse</text>
      <text class="s" x="480" y="156" text-anchor="middle">imports → edges</text>
      <rect class="mdl" x="590" y="110" width="160" height="62" rx="4"/>
      <text class="t" x="670" y="136" text-anchor="middle">label</text>
      <text class="s" x="670" y="156" text-anchor="middle">files no rule named</text>
      <rect class="box" x="780" y="110" width="160" height="62" rx="4"/>
      <text class="t" x="860" y="136" text-anchor="middle">store</text>
      <text class="s" x="860" y="156" text-anchor="middle">one transaction</text>

      <line class="ln" x1="180" y1="141" x2="207" y2="141" marker-end="url(#a)"/>
      <line class="ln" x1="370" y1="141" x2="397" y2="141" marker-end="url(#a)"/>
      <line class="ln" x1="560" y1="141" x2="587" y2="141" marker-end="url(#a)"/>
      <line class="ln" x1="750" y1="141" x2="777" y2="141" marker-end="url(#a)"/>

      <path class="tick" d="M100 172 V200 M290 172 V200 M480 172 V200 M670 172 V200 M860 172 V200 M100 200 H860"/>
      <line class="ln" x1="250" y1="200" x2="250" y2="247" marker-end="url(#a)"/>
      <text class="l" x="258" y="228">each stage writes</text>

      <rect class="box" x="150" y="250" width="200" height="50" rx="4"/>
      <text class="t" x="250" y="271" text-anchor="middle">analyses row</text>
      <text class="s" x="250" y="288" text-anchor="middle">status · stage · message</text>
      <rect class="box" x="470" y="250" width="200" height="50" rx="4"/>
      <text class="t" x="570" y="271" text-anchor="middle">progress page</text>
      <text class="s" x="570" y="288" text-anchor="middle">/analyses/[id]</text>
      <rect class="box" x="760" y="250" width="180" height="50" rx="4"/>
      <text class="t" x="850" y="271" text-anchor="middle">map</text>
      <text class="s" x="850" y="288" text-anchor="middle">/analyses/[id]/map</text>

      <line class="ln" x1="350" y1="275" x2="467" y2="275" marker-end="url(#a)"/>
      <text class="l" x="409" y="267" text-anchor="middle">trigger → realtime</text>
      <line class="ln" x1="670" y1="275" x2="757" y2="275" marker-end="url(#a)"/>
      <text class="l" x="714" y="267" text-anchor="middle">complete</text>
    </svg>
