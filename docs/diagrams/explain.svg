<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-label="Explaining a file: inside one traced run, read the neighbours, build a cache key, look it up; a hit answers with no model call, a miss fetches the file at the analysed commit, calls the model and checks the answer for invented paths. Alongside, a freshness check compares the analysed commit with GitHub's head.">
  <style>
    .box{fill:#ffffff;stroke:#c8cdd6;stroke-width:1.4}
    .grp{fill:none;stroke:#c8cdd6;stroke-width:1.2;stroke-dasharray:5 4}
    .mdl{fill:#fdf2df;stroke:#b06f12;stroke-width:1.6}
    .t{fill:#171a20;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#5a6170;font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .l{fill:#5a6170;font:italic 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .g{fill:#5a6170;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .ln{stroke:#171a20;stroke-width:1.3;fill:none}
    .tick{stroke:#c8cdd6;stroke-width:1.3;fill:none}
    .ah{fill:#171a20}
    @media (prefers-color-scheme: dark){
      .box{fill:#171a21;stroke:#363c48}.grp,.tick{stroke:#363c48}.mdl{fill:#2a2114;stroke:#e2a646}
      .t{fill:#e5e7ec}.s,.l,.g{fill:#9aa2b1}.ln{stroke:#e5e7ec}.ah{fill:#e5e7ec}
    }
  </style>
      <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>

      <rect class="box" x="20" y="120" width="140" height="60" rx="4"/>
      <text class="t" x="90" y="146" text-anchor="middle">explainSubject</text>
      <text class="s" x="90" y="164" text-anchor="middle">server action</text>

      <rect class="grp" x="185" y="20" width="635" height="200" rx="6"/>
      <text class="g" x="198" y="208">ONE TRACED RUN IN LANGSMITH</text>

      <rect class="box" x="200" y="45" width="130" height="50" rx="4"/>
      <text class="t" x="265" y="66" text-anchor="middle">neighbours</text>
      <text class="s" x="265" y="83" text-anchor="middle">user client, RLS</text>
      <rect class="box" x="350" y="45" width="120" height="50" rx="4"/>
      <text class="t" x="410" y="66" text-anchor="middle">cache key</text>
      <text class="s" x="410" y="83" text-anchor="middle">sha256(inputs)</text>
      <rect class="box" x="490" y="45" width="130" height="50" rx="4"/>
      <text class="t" x="555" y="66" text-anchor="middle">cache lookup</text>
      <text class="s" x="555" y="83" text-anchor="middle">explanations</text>

      <rect class="box" x="490" y="140" width="130" height="50" rx="4"/>
      <text class="t" x="555" y="161" text-anchor="middle">fetch at commit</text>
      <text class="s" x="555" y="178" text-anchor="middle">hash must match</text>
      <rect class="mdl" x="635" y="140" width="75" height="50" rx="4"/>
      <text class="t" x="672" y="161" text-anchor="middle">model</text>
      <text class="s" x="672" y="178" text-anchor="middle">mini</text>
      <rect class="box" x="725" y="140" width="85" height="50" rx="4"/>
      <text class="t" x="767" y="161" text-anchor="middle">path check</text>
      <text class="s" x="767" y="178" text-anchor="middle">invented?</text>

      <rect class="box" x="845" y="45" width="120" height="265" rx="4"/>
      <text class="t" x="905" y="72" text-anchor="middle">detail pane</text>
      <text class="s" x="905" y="92" text-anchor="middle">explanation</text>
      <text class="s" x="905" y="108" text-anchor="middle">+ freshness</text>

      <rect class="box" x="200" y="260" width="420" height="50" rx="4"/>
      <text class="t" x="410" y="281" text-anchor="middle">freshness check (alongside, not traced)</text>
      <text class="s" x="410" y="299" text-anchor="middle">analysed commit vs GitHub head · file hash vs stored</text>

      <path class="ln" d="M160 150 H180 V70 H197" marker-end="url(#a)"/>
      <path class="ln" d="M90 180 V285 H197" marker-end="url(#a)"/>
      <line class="ln" x1="330" y1="70" x2="347" y2="70" marker-end="url(#a)"/>
      <line class="ln" x1="470" y1="70" x2="487" y2="70" marker-end="url(#a)"/>
      <line class="ln" x1="620" y1="70" x2="842" y2="70" marker-end="url(#a)"/>
      <text class="l" x="731" y="62" text-anchor="middle">hit: no model call</text>
      <line class="ln" x1="555" y1="95" x2="555" y2="137" marker-end="url(#a)"/>
      <text class="l" x="562" y="121">miss</text>
      <line class="ln" x1="620" y1="165" x2="632" y2="165" marker-end="url(#a)"/>
      <line class="ln" x1="710" y1="165" x2="722" y2="165" marker-end="url(#a)"/>
      <line class="ln" x1="810" y1="165" x2="842" y2="165" marker-end="url(#a)"/>
      <line class="ln" x1="620" y1="285" x2="842" y2="285" marker-end="url(#a)"/>
      <text class="l" x="731" y="277" text-anchor="middle">fresh · moved on · file changed</text>
    </svg>
